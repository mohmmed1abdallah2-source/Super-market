name: supermarket_erp
description: Offline-first Arabic supermarket and retail ERP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.20.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.3
  firebase_core: ^3.10.0
  cloud_firestore: ^5.6.0
  pdf: ^3.11.3
  printing: ^5.14.2
  file_picker: ^8.1.7
  api_client:
    path: packages/api_client
  core_contracts:
    path: packages/core_contracts
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/report_logo.png.b64
