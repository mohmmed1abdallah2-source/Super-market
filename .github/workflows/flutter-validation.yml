name: Flutter validation

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/official-pdf-report-template
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = list(Path("android/app").glob("build.gradle*"))
          if not candidates:
              raise SystemExit("Android app Gradle file was not generated")

          updated = False
          for path in candidates:
              content = path.read_text()
              content, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)flutter\.compileSdkVersion\b",
                  r"\g<1>36",
                  content,
              )
              if count:
                  path.write_text(content)
                  print(f"Set compile SDK to 36 in {path}")
                  updated = True
                  break

          if not updated:
              raise SystemExit("Could not locate Flutter compileSdkVersion setting in generated Gradle file")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Set file_picker Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          candidates = list(cache.glob("file_picker-*/android/build.gradle*"))
          if not candidates:
              raise SystemExit("Could not find file_picker Android Gradle file in the Pub cache")

          updated = False
          for path in candidates:
              lines = path.read_text().splitlines()
              patched = []
              changed = False
              for line in lines:
                  if re.match(r"^\s*compileSdk(?:Version)?\b", line):
                      indent = re.match(r"^\s*", line).group(0)
                      patched.append(f"{indent}compileSdk 36")
                      changed = True
                  else:
                      patched.append(line)

              if changed:
                  path.write_text("\n".join(patched) + "\n")
                  print(f"Set file_picker compile SDK to 36 in {path}")
                  updated = True

          if not updated:
              details = []
              for path in candidates:
                  matching = [line for line in path.read_text().splitlines() if "compileSdk" in line]
                  details.append(f"{path}: {matching}")
              raise SystemExit("Could not locate file_picker compileSdk declaration. " + "; ".join(details))
          PY

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  validate-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: supermarket_test
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d supermarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      PGTEST_HOST: 127.0.0.1
      PGTEST_PORT: 5432
      PGTEST_DATABASE: supermarket_test
      PGTEST_USER: erp_test
      PGTEST_PASSWORD: erp_test_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PostgreSQL schema
        run: |
          PGPASSWORD="$PGTEST_PASSWORD" psql -h "$PGTEST_HOST" -U "$PGTEST_USER" -d "$PGTEST_DATABASE" -v ON_ERROR_STOP=1 -f migrations/20261109_001_erp_core.sql
          PGPASSWORD="$PGTEST_PASSWORD" psql -h "$PGTEST_HOST" -U "$PGTEST_USER" -d "$PGTEST_DATABASE" -v ON_ERROR_STOP=1 -f migrations/20261109_002_pos_sales_and_lah_alayh_ledger.sql
        working-directory: .

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get server dependencies
        run: dart pub get

      - name: Analyze Dart server
        run: dart analyze

      - name: Run server unit and PostgreSQL integration tests
        run: dart test

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows application
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform files
        run: flutter create --platforms=web .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web application
        run: flutter build web --release

      - name: Upload Web application
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web/
          if-no-files-found: error
