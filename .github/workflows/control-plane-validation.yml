name: Control plane validation

on:
  push:
    branches:
      - feature/control-plane-account-management
    paths:
      - 'server/control_plane/**'
      - 'server/lib/features/control_plane/**'
      - 'server/bin/server.dart'
      - 'docs/CONTROL_PLANE_ACCOUNT_API.md'
      - 'docs/CONTROL_PLANE_OPERATIONAL_AUTHORIZATION.md'
      - 'server/test/control_plane_*.dart'
      - 'server/test/store_database_*.dart'
      - '.github/workflows/control-plane-validation.yml'
  pull_request:
    branches:
      - feature/control-plane-account-management
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create a separate disposable control-plane database
        env:
          PGPASSWORD: disposable_test_only
        run: createdb -h 127.0.0.1 -p 5432 -U erp_test control_plane_test
      - name: Apply control-plane migration
        env:
          PGPASSWORD: disposable_test_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U erp_test -d control_plane_test \
            -v ON_ERROR_STOP=1 -f server/control_plane/migrations/001_control_plane.sql
      - name: Apply store membership invariants migration
        env:
          PGPASSWORD: disposable_test_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U erp_test -d control_plane_test \
            -v ON_ERROR_STOP=1 -f server/control_plane/migrations/002_store_membership_invariants.sql
      - name: Apply trusted store branch registry migration
        env:
          PGPASSWORD: disposable_test_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U erp_test -d control_plane_test \
            -v ON_ERROR_STOP=1 -f server/control_plane/migrations/003_store_branch_registry.sql
      - name: Apply store-scoped branch identifier migration
        env:
          PGPASSWORD: disposable_test_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U erp_test -d control_plane_test \
            -v ON_ERROR_STOP=1 -f server/control_plane/migrations/004_store_scoped_branch_ids.sql
      - name: Run rollback-only control-plane SQL assertions
        env:
          PGPASSWORD: disposable_test_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U erp_test -d control_plane_test \
            -v ON_ERROR_STOP=1 -f server/control_plane/tests/001_control_plane_assertions.sql
      - name: Create two disposable tenant databases
        env:
          PGPASSWORD: disposable_test_only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U erp_test tenant_a_test
          createdb -h 127.0.0.1 -p 5432 -U erp_test tenant_b_test
          psql -h 127.0.0.1 -p 5432 -U erp_test -d tenant_a_test -v ON_ERROR_STOP=1 -c "CREATE TABLE tenant_scope_test (branch_id TEXT PRIMARY KEY, marker TEXT NOT NULL); INSERT INTO tenant_scope_test VALUES ('shared-branch-id', 'tenant-a-only');"
          psql -h 127.0.0.1 -p 5432 -U erp_test -d tenant_b_test -v ON_ERROR_STOP=1 -c "CREATE TABLE tenant_scope_test (branch_id TEXT PRIMARY KEY, marker TEXT NOT NULL); INSERT INTO tenant_scope_test VALUES ('shared-branch-id', 'tenant-b-only');"
      - name: Resolve Dart server dependencies
        working-directory: server
        run: dart pub get
      - name: Analyze Dart server
        working-directory: server
        run: dart analyze
      - name: Run authorization, resolver and tenant routing tests
        working-directory: server
        env:
          PGTEST_HOST: 127.0.0.1
          PGTEST_PORT: 5432
          PGTEST_DATABASE: control_plane_test
          PGTEST_USER: erp_test
          PGTEST_PASSWORD: disposable_test_only
          ERP_STORE_DATABASES_JSON: >-
            {"tenant-a-test-key":{"host":"127.0.0.1","port":5432,"database":"tenant_a_test","username":"erp_test","password":"disposable_test_only","ssl":false},"tenant-b-test-key":{"host":"127.0.0.1","port":5432,"database":"tenant_b_test","username":"erp_test","password":"disposable_test_only","ssl":false}}
        run: |
          dart test test/control_plane_*_test.dart
          dart test test/store_database_connection_resolver_test.dart
          dart test test/store_database_routing_integration_test.dart
