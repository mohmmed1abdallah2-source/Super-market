name: Delivery Gates

on:
  push:
    branches:
      - feature/multi-store-isolation-foundation
  pull_request:
    branches:
      - feature/multi-store-isolation-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    name: Flutter analyze, tests and Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate missing Android platform files
        run: flutter create --platforms=android .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Check formatting
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed \
            packages/core_contracts/lib/inventory_purchase_contracts.dart \
            server/lib/features/inventory_and_purchases/domain/purchase_and_fefo_calculator.dart \
            server/lib/features/inventory_and_purchases/data/postgres_inventory_purchases_read_repository.dart \
            server/lib/features/inventory_and_purchases/presentation/inventory_purchases_routes.dart \
            server/test/inventory_purchase_contracts_test.dart
      - name: Analyze Flutter application
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  dart-server:
    name: Dart API analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve server dependencies
        working-directory: server
        run: dart pub get
      - name: Analyze server and shared contracts
        working-directory: server
        run: dart analyze
      - name: Run server tests
        working-directory: server
        run: dart test
      - name: Resolve shared contract test dependencies
        working-directory: packages/core_contracts
        run: dart pub get
      - name: Run shared contract tests
        working-directory: packages/core_contracts
        run: dart test
