name: Delivery Gates

on:
  push:
    branches:
      - feature/multi-store-isolation-foundation
  pull_request:
    branches:
      - feature/multi-store-isolation-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    name: Flutter analyze, tests and Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate missing Android platform files
        run: flutter create --platforms=android .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          changed_dart_files="$(git show --pretty='' --name-only HEAD -- '*.dart')"
          if [ -n "$changed_dart_files" ]; then
            printf '%s\n' "$changed_dart_files" | xargs dart format --output=none --set-exit-if-changed
          else
            echo "No Dart files changed in this commit."
          fi
      - name: Analyze Flutter application
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  dart-server:
    name: Dart API analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve server dependencies
        working-directory: server
        run: dart pub get
      - name: Analyze server and shared contracts
        working-directory: server
        run: dart analyze
      - name: Run server tests
        working-directory: server
        run: dart test
