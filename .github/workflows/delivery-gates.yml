name: Delivery Gates

on:
  push:
    branches:
      - feature/multi-store-isolation-foundation
  pull_request:
    branches:
      - feature/multi-store-isolation-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    name: Flutter analyze, tests and Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate missing Android platform files
        run: flutter create --platforms=android .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Set file_picker Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          candidates = list(cache.glob("file_picker-*/android/build.gradle*"))
          if not candidates:
              raise SystemExit("Could not find file_picker Android Gradle file in the Pub cache")

          updated = False
          for path in candidates:
              lines = path.read_text().splitlines()
              patched = []
              changed = False
              for line in lines:
                  if re.match(r"^\s*compileSdk(?:Version)?\b", line):
                      indent = re.match(r"^\s*", line).group(0)
                      patched.append(f"{indent}compileSdk 36")
                      changed = True
                  else:
                      patched.append(line)

              if changed:
                  path.write_text("\n".join(patched) + "\n")
                  print(f"Set file_picker compile SDK to 36 in {path}")
                  updated = True

          if not updated:
              details = []
              for path in candidates:
                  matching = [line for line in path.read_text().splitlines() if "compileSdk" in line]
                  details.append(f"{path}: {matching}")
              raise SystemExit("Could not locate file_picker compileSdk declaration. " + "; ".join(details))
          PY

      - name: Check formatting
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed \
            packages/core_contracts/lib/inventory_purchase_contracts.dart \
            lib/data/database/iteration3_inventory_schema.dart \
            server/lib/features/inventory_and_purchases/domain/purchase_and_fefo_calculator.dart \
            server/lib/features/inventory_and_purchases/application/purchase_invoice_posting.dart \
            server/lib/features/inventory_and_purchases/application/purchase_return_posting.dart \
            server/lib/features/inventory_and_purchases/data/postgres_inventory_purchases_read_repository.dart \
            server/lib/features/inventory_and_purchases/data/postgres_purchase_invoice_posting_repository.dart \
            server/lib/features/inventory_and_purchases/data/postgres_purchase_return_posting_repository.dart \
            server/lib/features/inventory_and_purchases/domain/purchase_and_fefo_calculator.dart \
            server/lib/features/inventory_and_purchases/presentation/inventory_purchases_routes.dart \
            server/lib/features/sales_and_sync/data/postgres_sales_sync_repository.dart \
            server/bin/server.dart \
            server/test/inventory_purchase_contracts_test.dart \
            server/test/postgres_purchase_invoice_posting_test.dart
      - name: Analyze Flutter application
        run: flutter analyze --no-fatal-infos lib test packages/core_contracts/lib packages/api_client/lib
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  dart-server:
    name: Dart API analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve server dependencies
        working-directory: server
        run: dart pub get
      - name: Analyze server and shared contracts
        working-directory: server
        run: dart analyze
      - name: Run server tests
        working-directory: server
        run: dart test
      - name: Resolve shared contract test dependencies
        working-directory: packages/core_contracts
        run: dart pub get
      - name: Run shared contract tests
        working-directory: packages/core_contracts
        run: dart test
